
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#06101c">
  <meta name="description" content="Tasks, reminders, notes and projects in one mobile-first app.">

  <title>FocusList</title>

  <!-- App manifest -->
  <link rel="manifest" href="./manifest.json">

  <!-- App icons -->
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-maskable-512.png">

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div id="app">

    <header class="topbar">
      <button
        class="icon-btn"
        id="menu-btn"
        aria-label="Open menu"
        type="button"
      ></button>

      <div class="brand">
        <img class="brand-logo" src="./icon.svg" alt="">
        <span class="brand-name">FocusList</span>
      </div>

      <button
        class="icon-btn"
        id="theme-btn"
        aria-label="Switch light / dark theme"
        type="button"
      ></button>
    </header>

    <main id="view"></main>

    <button
      class="fab"
      id="fab"
      aria-label="Add new"
      type="button"
    ></button>

  </div>

  <!-- Navigation and dialogs -->
  <div class="backdrop" id="backdrop"></div>
  <aside class="drawer" id="drawer" aria-label="Menu"></aside>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  <div class="toast" id="toast" role="status"></div>

  <!-- JavaScript modules: load in dependency order -->
  <script src="./utils.js"></script>
  <script src="./store.js"></script>
  <script src="./reminders.js"></script>
  <script src="./tasks.js"></script>
  <script src="./notes.js"></script>
  <script src="./projects.js"></script>
  <script src="./settings.js"></script>
  <script src="./main.js"></script>
</body>
</html>
