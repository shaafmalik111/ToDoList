<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06101c">
  <meta name="description" content="Tasks, reminders, notes and projects in one mobile-first app.">
  <title>FocusList</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="icon-btn" id="menu-btn" aria-label="Open menu"></button>
      <div class="brand">
        <img class="brand-logo" src="icons/icon.svg" alt="">
        <span class="brand-name">FocusList</span>
      </div>
      <button class="icon-btn" id="theme-btn" aria-label="Switch light / dark theme"></button>
    </header>

    <main id="view"></main>

    <button class="fab" id="fab" aria-label="Add new"></button>
  </div>

  <div class="backdrop" id="backdrop"></div>
  <aside class="drawer" id="drawer" aria-label="Menu"></aside>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  <div class="toast" id="toast" role="status"></div>

  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
